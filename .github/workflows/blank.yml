name: PC Cloud

on:
  workflow_dispatch:

jobs:
  pc-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # 1. Instala ferramentas (zstd é usado para compactar os dados)
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y htop curl wget git unzip build-essential zstd

      # 2. Restaura o backup da última execução (se existir)
      - name: Restaurar dados salvos
        uses: actions/cache/restore@v4
        with:
          path: /tmp/pc-home.tar.zst
          key: pc-home-${{ github.run_id }}
          restore-keys: |
            pc-home-

      # 3. Extrai os dados para a pasta de trabalho
      - name: Extrair dados
        run: |
          if [ -f /tmp/pc-home.tar.zst ]; then
            tar -I zstd -xf /tmp/pc-home.tar.zst -C "$HOME"
            echo "Dados restaurados da execução anterior."
          else
            echo "Primeira execução: nada para restaurar."
          fi
          mkdir -p "$HOME/workspace"

      # 4. Mostra as especificações da máquina
      - name: Informações da máquina
        run: |
          echo "=== CPU ==="
          nproc
          echo "=== Memória ==="
          free -h
          echo "=== Disco ==="
          df -h

      # 5. Sessão remota (tmate)
      - name: Sessão SSH (tmate)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 300
        with:
          limit-access-to-actor: true

      # 6. Compacta a pasta de trabalho ao final da sessão
      - name: Compactar dados
        if: always()
        run: |
          tar -I zstd -cf /tmp/pc-home.tar.zst -C "$HOME" workspace

      # 7. Envia o backup para o cache do GitHub
      - name: Salvar no cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/pc-home.tar.zst
          key: pc-home-${{ github.run_id }}
