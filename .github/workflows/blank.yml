name: PC Virtual Ubuntu

on:
  workflow_dispatch:
    inputs:
      crd_command:
        description: 'Cola aqui o comando do Chrome Remote Desktop (Debian Linux)'
        required: true
      pin:
        description: 'Define um PIN de 6 dígitos para aceder'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Dura até 6 horas seguidas

    steps:
      - name: Atualizar sistema e instalar Interface Gráfica (XFCE)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies dbus-x11 xbase-clients python3-psutil

      - name: Instalar Google Chrome
        run: |
          wget https://google.com
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Instalar Chrome Remote Desktop
        run: |
          wget https://google.com
          sudo apt install -y ./chrome-remote-desktop_current_amd64.deb

      - name: Configurar Ambiente Gráfico
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
          sudo usermod -a -G chrome-remote-desktop $USER

      - name: Iniciar PC Virtual
        run: |
          DISPLAY= /opt/google/chrome-remote-desktop/start-host --code="${{ github.event.inputs.crd_command }}" --redirect-url="https://google.com" --name="GitHub-PC" --pin="${{ github.event.inputs.pin }}"
          
      - name: Manter o PC ligado
        run: |
          echo "O teu PC está pronto! Acede em https://google.com"
          sleep 21000
